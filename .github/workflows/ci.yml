name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Test-only values. Real secrets live in the deployment environment.
  SESSION_SECRET: ci-session-secret-change-me-32chars
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  REDIS_URL: redis://localhost:6379
  ULB_CODE: "800645"
  SURVEY_PARCEL_DIGITS: "5"
  MINIO_TEST_ENDPOINT: localhost
  MINIO_TEST_PORT: "9000"
  MINIO_TEST_ACCESS_KEY: ci-minio-admin
  MINIO_TEST_SECRET_KEY: ci-minio-password
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Service containers cannot pass a command, so MinIO is started here.
      # Same image as docker-compose.prod.yml.
      - name: Start MinIO (storage integration tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_TEST_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_TEST_SECRET_KEY" \
            docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/types build
      - run: pnpm db:generate

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Apply migrations to an empty database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Check schema and migrations are in sync (no drift)
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (API incl. MinIO integration, portal, packages)
        run: pnpm test

      - name: API e2e tests
        # Suites share Redis lockout/rate-limit state; run serially.
        run: pnpm --filter api test:e2e -- --runInBand

      - run: pnpm docker:prod:config
      - run: docker compose config -q

      - name: Build all apps (website = Shamli)
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_ID: shamli

      - name: Website bundle contains only Shamli content
        run: |
          if grep -rlE "छाता|npchhata|Nagar Panchayat Chhata" apps/web/.next/static apps/web/.next/server \
               --include=*.js --include=*.html --include=*.rsc; then
            echo "::error::Chhata content leaked into the Shamli website build"; exit 1
          fi

      - name: Build Chhata website variant
        run: |
          rm -rf apps/web/.next
          pnpm --filter web build
          if grep -rlE "शामली|nppshamli|Palika Parishad Shamli" apps/web/.next/static apps/web/.next/server \
               --include=*.js --include=*.html --include=*.rsc; then
            echo "::error::Shamli content leaked into the Chhata website build"; exit 1
          fi
        env:
          NEXT_PUBLIC_SITE_ID: chhata

  security:
    name: Dependency audit & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (report all)
        # Remaining high findings are transitive major-version bumps (deepmerge-ts
        # in Prisma, sharp in Next) tracked in docs/operations/ci-cd.md.
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - name: Audit production dependencies (fail on critical)
        run: pnpm audit --prod --audit-level critical
      - name: Scan working tree for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-git --redact --no-banner \
            --config /repo/.gitleaks.toml

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [api, portal, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            API_BUILD_ID=${{ github.sha }}
