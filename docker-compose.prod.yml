# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
# Production Compose for Dokploy.
#
# Dokploy writes Environment-tab values to `.env` next to this file.
# Do NOT add Traefik labels, Caddy, or host port bindings — Dokploy Traefik
# attaches domains in the UI (Domains tab → service name + container port).
#
# API startup (same DATABASE_URL for all three steps):
#   PostgreSQL + Redis + MinIO healthy, minio-init done →
#   prisma migrate deploy → Super Admin seed → Nest
#
# Dokploy UI:
#   Compose path: docker-compose.prod.yml
#   Advanced → Isolated Deployments: ON
#   Domains (Let's Encrypt):
#     web     → PUBLIC_WEB_URL host,    port 3001
#     portal  → PUBLIC_PORTAL_URL host, port 3000
#
# Do not publish Postgres or Redis. Do not add container_name
# (Isolated Deployments suffixes resources).
#
# Internal API DNS: portal/web MUST use http://shamli-api:4000, not
# http://api:4000. Dokploy Traefik attaches a shared network to portal/web;
# Docker then merges A records for the short name `api` across every network
# the container is on. Another Compose stack named `api` on that shared
# network (stale or unrelated) answers HTTP 404 on :4000 with no Nest

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shamli_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - shamli_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  # Private object storage for survey/property images. Not published to the
  # host or Traefik: only the API talks to it (signed /api/v1/files links).
  # Do NOT attach a Dokploy domain to port 9000/9001. For console access use
  # an SSH tunnel (docs/storage/minio.md).
  # pgsty/silo is the maintained MinIO fork (same S3 API, MINIO_* vars and
  # on-disk format; bundles `mc`). Upstream quay.io/minio images now 401.
  minio:
    image: ${MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - shamli_minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "9000"

  # One-shot, idempotent provisioning (runs on every deploy, then exits 0):
  # bucket, least-privilege `shamli-api` policy, and the API user
  # MINIO_ACCESS_KEY. Re-running with a new MINIO_SECRET_KEY rotates it.
  # Never deletes objects. The API waits for this to complete successfully.
  minio-init:
    image: ${MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-shamli-survey-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        : "$${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        : "$${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
        : "$${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
        if [ "$$MINIO_ACCESS_KEY" = "$$MINIO_ROOT_USER" ]; then
          echo "[minio-init] MINIO_ACCESS_KEY must differ from MINIO_ROOT_USER (the API uses a least-privilege user)" >&2
          exit 1
        fi
        mc alias set shamli http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "shamli/$$MINIO_BUCKET"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$MINIO_BUCKET" "$$MINIO_BUCKET" > /tmp/shamli-api-policy.json
        mc admin policy create shamli shamli-api /tmp/shamli-api-policy.json >/dev/null
        mc admin user add shamli "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null
        mc admin policy attach shamli shamli-api --user "$$MINIO_ACCESS_KEY" >/dev/null
        echo "[minio-init] bucket, policy shamli-api and API user ready"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        API_BUILD_ID: ${API_BUILD_ID:-production}
    restart: unless-stopped
    env_file: .env
    # Required in Dokploy Environment tab (or compose warns and API exits on startup):
    #   SESSION_SECRET, POSTGRES_*, REDIS_PASSWORD, PUBLIC_*_URL,
    #   SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Single URL used by migrate, seed-cli, and the Nest process.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Redis is required for sessions, login lockout, and rate limiting.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_DIR: /app/uploads
      # Survey images in MinIO (credentials from the Dokploy Environment tab).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-shamli-survey-images}
      # Shamli GIS ids: 800645-003-00001-001-H (5-digit parcels).
      ULB_CODE: ${ULB_CODE:-800645}
      SURVEY_PARCEL_DIGITS: ${SURVEY_PARCEL_DIGITS:-5}
      CORS_ORIGIN: ${PUBLIC_PORTAL_URL},${PUBLIC_WEB_URL}
      PUBLIC_APP_URL: ${PUBLIC_PORTAL_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-chhata_session}
      API_BUILD_ID: ${API_BUILD_ID:-production}
      ATOM_RETURN_URL: ${PUBLIC_WEB_URL}/propertytax/payment/return
      # Atom server-to-server POST hits the citizen web domain; Next.js rewrites
      # /api/* to the internal API (see apps/web/next.config.ts). Nest handles
      # POST /api/v1/payments/gateway/callback on the API container.
      ATOM_CALLBACK_URL: ${PUBLIC_WEB_URL}/api/v1/payments/gateway/callback
    volumes:
      - shamli_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    expose:
      - "4000"
    networks:
      default:
        aliases:
          - shamli-api

  portal:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      args:
        API_INTERNAL_URL: http://shamli-api:4000
        NEXT_PUBLIC_APP_URL: ${PUBLIC_PORTAL_URL}
        NEXT_PUBLIC_CITIZEN_WEB_URL: ${PUBLIC_WEB_URL}
        NEXT_PUBLIC_ULB_CODE: ${ULB_CODE:-800645}
        NEXT_PUBLIC_SURVEY_PARCEL_DIGITS: ${SURVEY_PARCEL_DIGITS:-5}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://shamli-api:4000
      NEXT_PUBLIC_APP_URL: ${PUBLIC_PORTAL_URL}
      NEXT_PUBLIC_CITIZEN_WEB_URL: ${PUBLIC_WEB_URL}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-shamli_session}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://shamli-api:4000
        # Which municipality's website this image contains (shamli | chhata).
        NEXT_PUBLIC_SITE_ID: ${SITE_ID:-shamli}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://shamli-api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    expose:
      - "3001"

volumes:
  shamli_pg_data:
  shamli_redis_data:
  shamli_uploads:
  shamli_minio_data:
