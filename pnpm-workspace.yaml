packages:
  - "apps/*"
  - "packages/*"

catalog:
  react: 19.2.8
  react-dom: 19.2.8
  next: 16.3.4
  typescript: ^6.0.3
  eslint: ^10.13.0
  "@types/node": ^26.6.5

# pnpm 11 defaults this to "install": every `pnpm run` (incl. each task Turbo
# spawns in parallel) auto-installs when node_modules is stale, so concurrent
# installs race on the same symlinks (EBUSY on Windows). Fail fast instead and
# run `pnpm install` once from the root.
verifyDepsBeforeRun: error

overrides:
  # Pin to 11.x: >=11.1.1 security fix without uuid@14 ESM (breaks Jest + exceljs)
  uuid: ^14.0.2

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  argon2: true
  esbuild: false
  msgpackr-extract: false
  msw: false
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
